<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Community Forum</title>
    <link rel="icon" href="../assets/icons/monoIcon.svg" type="image/png"/>

    <link rel="stylesheet" href="../css/stylesheets/community.css">
</head>

<body>
    <header class="header">
        <a href="../index.html">
            <img src="../assets/img/logos/colorLogo.svg" alt="El isologo principal de La InfoWeb de Bases de Datos, compuesto por un ícono de base de datos, las letras BBDD en color blanco con estilo futurista y la palabra InfoWeb en color turquesa y con estilo cursivo.">
        </a>
        <p>Foro</p>
    </header>

    <div class="container">
        <main class="main-content">
            <section class="new-post">
                <h2>Nuevo mensaje</h2>
                <form id="post-form">
                    <div class="form-group">
                        <label for="name">Nombre:</label>
                        <input type="text" id="name" maxlength="50" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Mensaje:</label>
                        <textarea id="message" maxlength="500" required></textarea>
                    </div>
                    <button class="button__default" aria-label="Publicar mensaje" type="submit" id="submit-btn">
                        <img src="../assets/icons/buttom.svg" alt="Imagen del botón a la página del tema, compuesto por unos colores turquesa y rosa neon."/>
                        <span>Publicar</span>
                    </button>
                </form>
            </section>

            <section class="posts">
                <h2>Mensajes</h2>
                <div class="loading" id="loading">Cargando mensajes...</div>
                <div id="error-message" class="error-message"></div>
                <div id="posts-container"></div>
            </section>
        </main>

    </div>

    <footer class="footer">
        <p>
            Créditos y Desarrollo Disponibles en:
            <a href="https://github.com/ArtDaSak/BBDD-InfoWeb" target="_blank" aria-label="Ir al Repositorio de GitHub del Proyecto.">BBDD-InfoWeb</a>.
        </p>
    </footer>

    <script src="../js/scripts/community.js"></script>
</body>

</html>
